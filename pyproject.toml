[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nasa-space-ml"
version = "0.1.0"
description = "Two NASA-data machine learning problems served by one FastAPI application: exoplanet candidate validation and near-Earth object hazard classification."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yuvraj Pateria" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
nasa-space-ml = "nasa_space_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = [
    "network: hits a real NASA endpoint (deselected by default)",
]
filterwarnings = [
    "error",
    # joblib 1.x sets `.shape` on arrays it loads, which NumPy 2.5 deprecated. It fires
    # thousands of times per model load, from inside site-packages, and is not ours to fix -
    # pinned so that warnings raised by *our* code still fail the build.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
    # Starlette's TestClient would rather import a package called `httpx2` and falls back to
    # `httpx`, warning on import when it does. The fallback is supported, `httpx` is already
    # this project's HTTP client, and installing a second client just to silence a notice
    # about a migration Starlette owns would mean shipping a dependency the application
    # never uses. Scoped to this one warning category and message, so everything else -
    # including anything our own code raises - still errors. This filter is load-bearing:
    # without it `pip install ".[dev]"` in a clean environment fails at collection, as the
    # first CI run of this repository discovered.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]
